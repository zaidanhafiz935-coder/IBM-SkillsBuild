    .btn-masuk { padding: 8px 20px; background: #d32f2f; border: none; color: #fff; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }

    .banner-center { text-align: center; position: relative; z-index: 1; flex: 1; }

    .app-btn:hover { background: #222; }
    .banner-right { display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 1; align-items: flex-end; }
    .banner-right .speech-bubble { background: #fff; color: #d32f2f; font-weight: 900; font-size: 22px; padding: 12px 20px; border-radius: 12px; line-height: 1.2; text-align: center; }
    .coin-decor { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .coin { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe082, #f57c00); border: 2px solid #e65100; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #e65100; }
    .main { max-width: 1200px; margin: 0 auto; padding: 0 24px 40px; }
    .section-title { font-size: 20px; font-weight: 700; margin: 24px 0 16px; color: #222; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .product-card { background: #fff; border-radius: 10px; border: 1px solid #e8e8e8; overflow: hidden; transition: box-shadow 0.2s, transform 0.2s; cursor: pointer; }
    .product-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.12); transform: translateY(-2px); }

    .product-price { font-size: 16px; font-weight: 700; color: #d32f2f; margin-top: 2px; }

    .btn-beli { width: 100%; background: #d32f2f; color: #fff; border: none; padding: 10px; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 0 0 10px 10px; transition: background 0.15s; }

function imgHTML(p) {
